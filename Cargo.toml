[workspace]
resolver = "3"
members = ["pgrx_validation", "pgrx_validation_derive"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
pgrx = "0.16.1"
pgrx-tests = "0.16.1"
pgrx_validation_derive = { path = "pgrx_validation_derive" }
phf = { version = "0.13.1", features = ["macros"] }
quote = "1.0"
syn = { version = "2.0.110", features = ["full"] }
thiserror = "2.0.21"
trybuild = "1.0.111"
validator = "0.20"

[workspace.lints.rust]
missing_docs = "deny"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pgrx_embed)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[workspace.lints.clippy]
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
